name: List Expired Branches
author: DevOps
description: List expired branches json based on retention policy

# Expected Variables
# ~ $days_retention
# ~ $repository
# ~ $namespace

inputs:
  days-retention:
    description: 'Retention policy days'
    required: false
    default: 14

outputs:
  has-branches:
    description: 'Has expired branches'
    value: ${{ steps.branches.outputs.has-expired-branches }}
  expired-branches-json:
    description: 'Expired branches'
    value: ${{ steps.branches.outputs.expired-branches-json }}
    
runs:
  using: 'composite'
  steps:
  - shell: bash
    if: (env.days_retention == '' && inputs.days-retention == '') || env.repository == '' || env.repository == ''
    run: |
      echo "Failed expected variables check."
      exit 1

  - shell: bash
    if: env.days_retention == '' && inputs.days-retention != ''
    run: |
      $days_retention = ${{ inputs.days-retention }}

  - uses: actions/checkout@v4
    with:
      fetch-depth: 0 # Fetch all history for all branches and tags
      
  - id: branches
    shell: bash
    run: |
      bash ${{ github.action_path }}/gha/expired-branches.sh
